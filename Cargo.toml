[package]
name = "enginesim"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
eframe = "0.33.2"
egui_plot = "0.34.1"
rtrb = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
onedpipes = { path = "../onedpipes" }

[dev-dependencies]
pprof = { version = "0.15.0", features = ["flamegraph"] }

[profile.release]
debug = true

[profile.profiling]
inherits = "release"
debug = true
